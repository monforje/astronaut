name: ${COMPOSE_PROJECT_NAME:-landing-front}

services:
  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-landing-front}
    image: ${DOCKER_BUN_IMAGE_NAME:-oven/bun:1.4.3}
    working_dir: /app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-}"
    command: ["bun", "run", "dev"]
    volumes:
      - .:/app
      # Бренд подключён симлинками (../../../idea/skelet/brand/… из /app упирается в / и попадает сюда):
      # правка в idea/skelet/brand сразу видна dev-серверу.
      - ../../idea/skelet/brand:/idea/skelet/brand:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.landing-front.rule=Host(`${APP_HOSTNAME:-landing.astronaut.localhost}`)
      - traefik.http.services.landing-front.loadbalancer.server.port=80

networks:
  traefik:
    external: true

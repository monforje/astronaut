name: ${COMPOSE_PROJECT_NAME:-demo-site-front}

services:
  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-demo-site-front}
    image: ${DOCKER_BUN_IMAGE_NAME:-oven/bun:1.4.3}
    working_dir: /app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
      API_PROXY_TARGET: "http://${BACKEND:-astronaut}-http:8080"
    command: ["bun", "run", "dev"]
    volumes:
      - .:/app
      # Бренд подключён симлинками (../../../idea/skelet/brand/… из /app упирается в / и попадает сюда):
      # правка в idea/skelet/brand сразу видна dev-серверу.
      - ../../idea/skelet/brand:/idea/skelet/brand:ro
      # Кит — зависимость `file:../ui-kit`: node_modules/@astronaut/ui-kit это симлинк ../../../ui-kit, из /app он ведёт сюда.
      # Пакету нужен собранный dist-lib (task ui-kit).
      - ../ui-kit:/ui-kit:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.demo-site-front.rule=Host(`${APP_HOSTNAME:-demo.astronaut.localhost}`)
      - traefik.http.routers.demo-site-front.priority=1
      - traefik.http.services.demo-site-front.loadbalancer.server.port=80

networks:
  traefik:
    external: true

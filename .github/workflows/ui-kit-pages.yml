name: ui-kit-pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/ui-kit/**"
      - "idea/skelet/brand/**"
      - ".github/workflows/ui-kit-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"
  # Проектная страница: https://<owner>.github.io/<repo>/. Для своего домена: BASE_PATH "/" и SITE_URL "https://домен/".
  BASE_PATH: /astronaut/
  SITE_URL: https://monforje.github.io/astronaut/

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ui-kit
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: README и llms*.txt актуальны
        run: |
          bun run docs
          git diff --exit-code -- .

      - run: bun run verify

      - run: bun run build

      - name: dist содержит бренд и шрифты
        run: |
          test -f dist/brand/logo-mark.svg
          test -f dist/favicon.svg
          test -f dist/llms.txt
          test -f dist/entries/button.md
          ls dist/assets/*.ttf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/ui-kit/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
